name: smoke-test
on:
    push:
        branches:
            - "*"
    pull_request:
        branches:
            - "*"

jobs:
    smoke-tests:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v3
              with:
                  version: 9.15.0

            - uses: actions/setup-node@v4
              with:
                  node-version: "23.3.0"
                  cache: "pnpm"

            - name: Install native build deps for canvas/opus
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                      libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev \
                      librsvg2-dev libpixman-1-dev libopus-dev pkg-config

            - name: Run smoke tests
              run: pnpm run smokeTests
