[workspace]
members = [
    "common",
    "conversion",
    "staking",
    "estate",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = "0.30.1"
solana-program = "1.18.26"
defai-protocol-common = { path = "common", default-features = false }
defai_swap = { path = "conversion", default-features = false }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

[patch.crates-io]
# Pin blake3 for Solana SBF toolchain — 1.8.x pulls digest 0.11 / edition2024 crypto-common.
blake3 = { git = "https://github.com/BLAKE3-team/BLAKE3", tag = "1.5.5" }
